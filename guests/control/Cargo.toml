[package]
name = "control"
version.workspace = true
edition.workspace = true
publish.workspace = true

# No dependencies, and no `guest-sdk`: the SDK's crt0 zeroes `.bss` with a
# store loop and calls `main`, and stores belong to a memory family. This guest
# is its own `_start`, written in the instructions of two execution families —
# add/sub/lui/auipc and jump/branch/slt — and `EXIT`, so its statement proves
# those two alone. `guests/.cargo/config.toml` supplies the target and the
# linker script.
[dependencies]
