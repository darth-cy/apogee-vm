[package]
name = "addsub"
version.workspace = true
edition.workspace = true
publish.workspace = true

# No dependencies, and no `guest-sdk`: the SDK's crt0 zeroes `.bss` with a loop
# and calls `main`, which are branches, stores and jumps — families S16 has no
# circuit for. This guest is its own `_start`, written in the five
# instructions and the one ecall S16 proves. `guests/.cargo/config.toml` still
# supplies the target and the frozen linker script.
[dependencies]
