[package]
name = "addsub"
version.workspace = true
edition.workspace = true
publish.workspace = true

# No dependencies, and no `guest-sdk`: the SDK's crt0 zeroes `.bss` with a loop
# and calls `main`, which are branches, stores and jumps — other families'
# instructions. This guest is its own `_start`, written in the add/sub family's
# five instructions and `EXIT`, so its statement proves that one family alone.
# `guests/.cargo/config.toml` supplies the target and the linker script.
[dependencies]
