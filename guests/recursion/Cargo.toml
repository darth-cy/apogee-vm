[package]
name = "recursion"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The recursion leaf (`docs/spec/recursion.md` §8): `verifier_core::node`'s
# procedure over base shards, its tapes in its image. `build.rs` builds the
# image from `base.key` with the same crate, on the host. Like `revm-block`,
# it has no committed ELF: it is built on demand.
[dependencies]
guest-sdk.workspace = true
constants = { path = "../../crates/constants" }
verifier-core = { path = "../../crates/verifier-core" }

[build-dependencies]
verifier-core = { path = "../../crates/verifier-core" }
