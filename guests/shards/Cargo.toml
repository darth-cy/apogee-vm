[package]
name = "shards"
version.workspace = true
edition.workspace = true
publish.workspace = true

# No dependencies, and no `guest-sdk`: this guest must run more than 2^20
# cycles of ONE family and touch no RAM at all, so the SDK's crt0 -- which
# zeroes `.bss` with a store loop -- would pull in a memory family and a
# `ZERO_WINDOWS` shard the demo does not want. It is its own `_start`, written
# in the instructions of two families, add/sub/lui/auipc and jump/branch/slt,
# and the one ecall S16 proves. `guests/.cargo/config.toml` supplies the target
# and the frozen linker script.
[dependencies]
