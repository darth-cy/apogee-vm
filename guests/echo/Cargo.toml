[package]
name = "echo"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
guest-sdk.workspace = true
# The journal's payload bound, so the echo's ceiling is the window's own number
# and not a literal copied out of a spec.
constants = { path = "../../crates/constants" }
# The software twin of the `POSEIDON2` delegation. Linking it here is the
# point: it makes `poseidon2_permute`'s fallback the real function rather than
# a stand-in, and it proves the transcript crate compiles and runs on RV32.
transcript = { path = "../../crates/transcript" }
field = { path = "../../crates/field" }
