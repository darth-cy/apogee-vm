# The guest template config. One setting and two linker flags, and nothing
# that a guest author has to remember to type.
[build]
target = "riscv32imac-unknown-none-elf"

[target.riscv32imac-unknown-none-elf]
# No `runner`. An Apogee guest is an Apogee-SDK program and not a Linux
# executable: its input, its advice and its journal are windows of guest memory
# this VM lays out (`docs/spec/public-values.md`), which nothing outside the VM
# maps. `cargo run` on a guest therefore has nothing to run it with, and the
# executor is `crates/emulator`.

# `-T`  the frozen memory map, which also defines the symbols crt0 and the bump
#       allocator reference. Resolved relative to the directory cargo runs the
#       linker in, which is this workspace's root.
# `--no-relax`  linker relaxation rewrites instruction sequences and shifts
#       every later address. Program identity in S11 is a function of those
#       addresses, so relaxation is off, permanently.
rustflags = [
    "-C",
    "link-arg=-T../crates/guest-sdk/link.ld",
    "-C",
    "link-arg=--no-relax",
]
