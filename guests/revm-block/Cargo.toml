[package]
name = "revm-block"
version.workspace = true
edition.workspace = true
publish.workspace = true

# S24's workload guest. `src/lib.rs` is the program and it compiles for the
# host as well as for the guest: `crates/emulator/tests/revm.rs` calls it
# directly as the native-revm oracle and `tools/kat-gen` builds the committed
# witness against it. Only the two binaries are guest-only, so the guest
# runtime is a dependency of the guest target alone -- unconditionally, a host
# build would try to assemble crt0 and link a second `#[panic_handler]`. That
# is a condition on the target, not a cargo feature: each target still has
# exactly one build configuration.
#
# `revm` is the workload being proven, which `prompts/S24-revm.md` names a
# permitted guest dependency; it is reachable from no prover, no verifier and
# no other guest. The `alloy-primitives` edge below exists only to turn on
# that crate's `native-keccak`, which routes every keccak256 in the image --
# revm's included -- through the S21 delegation shim. A `features` key inside a
# dependency entry selects an upstream crate's features and is not a
# `[features]` table of ours: `crates/prover/tests/one_feature.rs` still holds.
[lib]
name = "revm_block"
path = "src/lib.rs"

# The guest, and the provable one since S-IO: its witness is advice and its
# output commitment is the journal.
[[bin]]
name = "revm-block"
path = "src/main.rs"

# S25's second mode, and a **second program identity**, which is what
# must-be-exact 2 asks for: the whole block transition, the pre-state
# authenticated against the parent's state root and the post-state root
# recomputed and checked against the header's. It publishes a different journal
# from `revm-block`'s -- 148 fixed bytes rather than a record per transaction,
# which a real block's would not fit in a public window.
[[bin]]
name = "revm-block-stateless"
path = "src/stateless_main.rs"

# The same computation over fd 0 and fd 1, for the executors with no advice
# region -- `qemu-riscv32`, and the native-revm oracle it is compared against.
# Not provable, and it does not need to be.
[[bin]]
name = "revm-block-stdio"
path = "src/stdio.rs"

# `revm`'s version is pinned **exactly**, and that is not tidiness. A guest's
# `ProgramIdentity` is a digest of its compiled image, so a patch bump to any
# crate in this tree silently moves it -- and with it every identity, output
# digest and gas number pinned in `crates/emulator/tests/revm.rs`,
# `crates/prover/tests/revm.rs` and this stage's handoff. `42.0.1` is also the
# version whose gas schedule those numbers were measured under. Both lockfiles
# resolve it already -- this crate is in `guests/`' workspace and is a path
# dependency of `crates/emulator`, `crates/prover` and `tools/kat-gen` in the
# main one -- and `=` is what stops a `cargo update` in either from moving it
# without a decision.
[dependencies]
revm = { version = "=42.0.1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
guest-sdk.workspace = true
alloy-primitives = { version = "1.7.3", default-features = false, features = ["native-keccak"] }
