[package]
name = "revm-block"
version.workspace = true
edition.workspace = true
publish.workspace = true

# S24's workload guest. `src/lib.rs` is the program and it compiles for the
# host as well as for the guest: `crates/emulator/tests/revm.rs` calls it
# directly as the native-revm oracle and `tools/kat-gen` builds the committed
# witness against it. Only the two binaries are guest-only, so the guest
# runtime is a dependency of the guest target alone -- unconditionally, a host
# build would try to assemble crt0 and link a second `#[panic_handler]`. That
# is a condition on the target, not a cargo feature: each target still has
# exactly one build configuration.
#
# `revm` is the workload being proven, which `prompts/S24-revm.md` names a
# permitted guest dependency; it is reachable from no prover, no verifier and
# no other guest. The `alloy-primitives` edge below exists only to turn on
# that crate's `native-keccak`, which routes every keccak256 in the image --
# revm's included -- through the S21 delegation shim. A `features` key inside a
# dependency entry selects an upstream crate's features and is not a
# `[features]` table of ours: `crates/prover/tests/one_feature.rs` still holds.
[lib]
name = "revm_block"
path = "src/lib.rs"

# The normative guest: its witness arrives on fd 0 and its output leaves on
# fd 1, which is must-be-exact 1.
[[bin]]
name = "revm-block"
path = "src/main.rs"

# The same program with its witness in the image, which is what makes it
# provable today: `read` and `write` are not yet provable ecalls, so this one
# calls neither. `docs/handoff/S24-revm.md` says why it exists.
[[bin]]
name = "revm-block-embedded"
path = "src/embedded.rs"

[dependencies]
revm = { version = "42.0.1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
guest-sdk.workspace = true
alloy-primitives = { version = "1.7.3", default-features = false, features = ["native-keccak"] }
