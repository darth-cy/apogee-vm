[workspace]
resolver = "2"
members = [
    "crates/constants",
    "crates/field",
    "crates/transcript",
    "crates/poly",
    "crates/sumcheck",
    "crates/loader",
    "crates/isa",
    "crates/program",
    "crates/trace",
    "crates/emulator",
    "crates/constraints",
    "crates/gkr-verify",
    "crates/gkr",
    "crates/checker",
    "crates/verifier-core",
    "crates/verifier",
    "crates/prover",
    "crates/host",
    "tools/kat-gen",
    "tools/bench",
    "tools/profiler",
    "tools/artifact-dump",
    "tools/test-support",
]

# Excluded, each for its own reason: `tools/transcript-ref` and `crates/guest-sdk`
# say why in their manifests, and `guests/` is the guest workspace.
exclude = ["tools/transcript-ref", "crates/guest-sdk", "guests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
constants = { path = "crates/constants" }
field = { path = "crates/field" }
transcript = { path = "crates/transcript" }
poly = { path = "crates/poly" }
sumcheck = { path = "crates/sumcheck" }
loader = { path = "crates/loader" }
isa = { path = "crates/isa" }
program = { path = "crates/program" }
trace = { path = "crates/trace" }
emulator = { path = "crates/emulator" }
constraints = { path = "crates/constraints" }
gkr-verify = { path = "crates/gkr-verify" }
gkr = { path = "crates/gkr" }
checker = { path = "crates/checker" }
verifier-core = { path = "crates/verifier-core" }
verifier = { path = "crates/verifier" }
prover = { path = "crates/prover" }
host = { path = "crates/host" }

# Test-only, and a dev-dependency everywhere it appears: SHA-256 for pinning
# committed fixtures, and the hex codec those files are written in.
test-support = { path = "tools/test-support" }

# Data parallelism. Beside it the workspace has one thread scope and one lock,
# the streaming prover's shard pipeline (`docs/spec/streaming.md` §5); no
# async, no channels.
rayon = "1"

# `default-features = false` keeps serde `no_std`, which `constants` and `field`
# must stay for the guest target. This is not a cargo feature of ours: the
# workspace still has exactly one build configuration.
serde = { version = "1", default-features = false }

# Test / tool only. The reference field arithmetic and multilinear extensions
# for the differential checks and the KAT fixtures; each user derives its own
# `Fr` from `ark-ff`'s `MontConfig` over the modulus. Never linked by the
# prover, the verifier or a guest.
ark-ff = "0.6"
ark-poly = "0.6"

# Test only. Exercises the `Fr` serde impls over a real wire format.
postcard = { version = "1", default-features = false }

# JSON: the reports `tools/bench` and `tools/profiler` write. Nothing here is
# reachable from the prover, the verifier or a guest.
serde_json = "1"

# The workspace tests build circuits at their real `2^20` rows and execute
# guests. Unoptimized that is minutes per run, which would make `cargo test
# --workspace` unusable. Optimizing the dev profile keeps `debug-assertions` and
# `overflow-checks` on, so the tests still run with every check the default dev
# profile gives them; only the code generation changes.
[profile.dev]
opt-level = 2
