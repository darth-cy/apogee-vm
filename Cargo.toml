[workspace]
resolver = "2"
members = [
    "crates/constants",
    "crates/field",
    "crates/curve",
    "crates/transcript",
    "crates/poly",
    "crates/sumcheck",
    "crates/srs",
    "crates/pcs",
    "crates/loader",
    "tools/kat-gen",
    "tools/bench",
    "tools/artifact-dump",
    "tools/test-support",
]

# Excluded, each for its own reason: `tools/transcript-ref` and `crates/guest-sdk`
# say why in their manifests, and `guests/` is the guest workspace.
exclude = ["tools/transcript-ref", "crates/guest-sdk", "guests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
constants = { path = "crates/constants" }
field = { path = "crates/field" }
curve = { path = "crates/curve" }
transcript = { path = "crates/transcript" }
poly = { path = "crates/poly" }
sumcheck = { path = "crates/sumcheck" }
srs = { path = "crates/srs" }
pcs = { path = "crates/pcs" }
loader = { path = "crates/loader" }

# Test-only, and a dev-dependency everywhere it appears: SHA-256 for pinning
# committed fixtures, and the hex codec those files are written in.
test-support = { path = "tools/test-support" }

# Data parallelism, and the only form of it in the workspace: no threads, no
# async, no channels. Master rule 2 names it explicitly. `curve` uses it for the
# MSM's window and input-chunk fan-out, `srs` for point decoding at ingestion.
rayon = "1"

# `default-features = false` keeps serde `no_std`, which `constants` and `field`
# must stay for the guest target. This is not a cargo feature of ours: the
# workspace still has exactly one build configuration.
serde = { version = "1", default-features = false }

# Test / tool only. Reference implementation for differential checks and the
# KAT fixtures. Never linked by the prover, verifier, or a guest.
# `parallel` is enabled so the S07 acceptance-9 gate compares two rayon
# implementations rather than ours against a single-threaded arkworks, which
# would be a gate we pass by not being compared. These are dev-dependencies and
# tool dependencies only; nothing here is reachable from a prover, a verifier or
# a guest, and anti-goal 1 bans cargo features *of ours*, not an upstream
# oracle's build configuration.
ark-bn254 = "0.6"
ark-ec = { version = "0.6", features = ["parallel"] }
ark-ff = { version = "0.6", features = ["parallel"] }
ark-poly = "0.6"

# Tooling only, in `kat-gen` alone. The exact final exponent is (q^12 - 1)/r,
# a 2,790-bit integer, and the fixtures state that definition rather than
# trusting any library's decomposition of it. Already in the tree as an
# `ark-ff` dependency; never reachable from the prover, verifier, or a guest.
num-bigint = { version = "0.4", default-features = false }

# Test only. Exercises the `Fr` serde impls over a real wire format.
postcard = { version = "1", default-features = false }

# Acceptance 1 proves a 2^20-row zerocheck, and must-be-exact 7's witness digest
# absorbs every cell of every column through Poseidon2 — about 2^21 sponge
# elements. Unoptimized that is minutes per run, which would make
# `cargo test --workspace` unusable. Optimizing the dev profile keeps
# `debug-assertions` and `overflow-checks` on, so the tests still run with every
# check the default dev profile gives them; only the code generation changes.
[profile.dev]
opt-level = 2
