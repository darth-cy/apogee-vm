name: ci

# The toolchain, its components and the guest target come from rust-toolchain.toml.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: toolchain
        run: rustup show && cargo --version

      # Five manifests: the workspace, the two reference tools outside it, and the two
      # guest-target workspaces (`crates/guest-sdk`, `guests`), which have no test targets.
      - name: fmt
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path tools/transcript-ref/Cargo.toml --all -- --check
          cargo fmt --manifest-path tools/stateless-ref/Cargo.toml --all -- --check
          cargo fmt --manifest-path crates/guest-sdk/Cargo.toml --all -- --check
          cargo fmt --manifest-path guests/Cargo.toml --all -- --check

      - name: clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path tools/transcript-ref/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path tools/stateless-ref/Cargo.toml --all-targets -- -D warnings
          (cd crates/guest-sdk && cargo clippy --target riscv32imac-unknown-none-elf -- -D warnings)
          (cd guests && cargo clippy --bins -- -D warnings)
          # `prover/debug-info` is the workspace's one cargo feature; it is linted and tested on.
          cargo clippy -p prover --all-targets --features debug-info -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: test the debug-info configuration
        run: |
          cargo test -p prover --features debug-info --test debug_info
          cargo test -p prover --features debug-info --lib

      # Builds guests at both profiles and checks that each image declares exactly the
      # delegation families it links (docs/spec/delegation.md §7).
      - name: static detachment survives the optimiser
        run: cargo test -p program --test delegation -- --ignored --test-threads=1

      # Builds guests/revm-block at --release and holds its journal to native revm's.
      - name: the revm guest against native revm
        run: APOGEE_GUEST_PROFILE=release cargo test -p emulator --test revm -- --ignored --test-threads=1

      # The proving suites are `#[ignore]`d and are not run here: each proves real shards
      # (2^20 rows and up) and needs tens of GB of memory. README.md lists them.

      # The crates the recursion guest links compile for the guest target.
      - name: guest target builds
        run: cargo build -p field -p constants -p transcript -p poly -p sumcheck -p constraints -p gkr-verify -p pcs-verify -p verifier-core --target riscv32imac-unknown-none-elf

      - name: a guest builds from the template config
        run: cd guests/fib && cargo build --target riscv32imac-unknown-none-elf

      # Committed fixtures are regenerated and diffed. Groups that need the ceremony file
      # (`srs`, the identity pin) skip without it; `guests`, `block` and `zkevm` are opt-in.
      - name: committed fixtures are reproducible
        run: |
          cargo run -p kat-gen
          cargo run --manifest-path tools/transcript-ref/Cargo.toml
          cargo run --manifest-path tools/stateless-ref/Cargo.toml
          git diff --exit-code -- crates/host/tests/vectors/stateless_ref.txt crates/field/tests/vectors/ crates/transcript/tests/vectors/ crates/poly/tests/vectors/ crates/curve/tests/vectors/ crates/srs/tests/vectors/ crates/pcs/tests/vectors/ crates/loader/tests/vectors/ crates/isa/tests/vectors/ crates/program/tests/vectors/ crates/constants/tests/vectors/ crates/constraints/tests/vectors/ crates/checker/tests/vectors/ crates/emulator/tests/vectors/
