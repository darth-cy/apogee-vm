name: ci

# The toolchain, its components and the guest target all come from
# rust-toolchain.toml; rustup installs them on the first cargo invocation.
# Nothing here may drift from that pin.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: toolchain
        run: rustup show && cargo --version

      # User-mode QEMU is the only executor S10 has: the guests run under it
      # unmodified, which is why the ecall ABI uses Linux numbers. It is
      # Linux-only -- no native macOS build exists -- so `crates/loader/tests/
      # qemu.rs` is `#[ignore]`d, which keeps a developer machine without an
      # emulator from reporting silent coverage. This runner is Linux, so it
      # asks for the suite by name. Execution is the one property nothing else
      # here can witness: `tests/layout.rs` covers the *image*, but only an
      # executor shows that the guests compute what they commit.
      - name: qemu-riscv32
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      #
      # `--include-ignored`, not `--ignored`: the latter runs *only* ignored
      # tests, so a case added here without the attribute would be filtered out
      # and CI would report green for a suite it never ran. Every case in the
      # file carries `#[ignore]` today; this is what keeps that from being
      # load-bearing.
      - name: guests execute
        run: cargo test -p loader --test qemu -- --include-ignored

      # The same eleven cases, same expected bytes, at `--release`. This is what
      # holds the profile pin in `guests/Cargo.toml` honest: with cargo's
      # defaults `overflow-checks` is off in release, and a guest then commits a
      # wrapped `u32` on fd 1 where the dev build panics and exits 101. fd 1 is
      # the committed public output, so that would make the optimisation level
      # part of the statement being proven. It also builds at `--release` the
      # ten guests this suite runs; `consistency`'s release build is the
      # consistency step below, and `opcodes` and `heap` have none in CI.
      - name: guests execute (release)
        env:
          APOGEE_GUEST_PROFILE: release
        run: cargo test -p loader --test qemu -- --include-ignored

      # S12's differential: the emulator's trace against qemu-riscv32's
      # per-instruction register log, over the committed guests. `#[ignore]`d
      # for the reason the suite above is, and asked for by name the same way.
      - name: emulator matches QEMU
        run: cargo test -p emulator --test differential -- --include-ignored

      # The three-way consistency suite: `guests/consistency` on the host,
      # under qemu-riscv32 and on the emulator, over one corpus of inputs. The
      # host-and-emulator half runs in the `test` step below; this is the half
      # that says which of two disagreeing legs is wrong. Both guest profiles,
      # for the reason the release step above gives.
      - name: host, QEMU and emulator agree
        run: |
          cargo test -p emulator --test consistency -- --include-ignored
          APOGEE_GUEST_PROFILE=release cargo test -p emulator --test consistency -- --include-ignored

      # Four workspaces, all gated. `crates/guest-sdk` and `guests/` are separate
      # workspaces because they compile only for the guest target, and guest-sdk
      # is the one crate in the repository permitted `unsafe` -- so it is the one
      # that most needs the lints, not the one to leave outside them. Neither
      # takes `--all-targets`: there is no `test` crate for a no_std target.
      - name: fmt
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path tools/transcript-ref/Cargo.toml --all -- --check
          cargo fmt --manifest-path crates/guest-sdk/Cargo.toml --all -- --check
          cargo fmt --manifest-path guests/Cargo.toml --all -- --check

      - name: clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path tools/transcript-ref/Cargo.toml --all-targets -- -D warnings
          (cd crates/guest-sdk && cargo clippy --target riscv32imac-unknown-none-elf -- -D warnings)
          (cd guests && cargo clippy --bins -- -D warnings)
          # The workspace's ONE cargo feature (master anti-goal 1's one
          # exception, owner's decision at S20): the anti-goal's stated hazard
          # is "a configuration nobody builds is broken and undiscovered", so
          # this configuration is built, linted and tested here like any other.
          # `crates/prover/tests/one_feature.rs` is what keeps it at one.
          cargo clippy -p prover --all-targets --features metrics -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: test the metrics configuration
        run: cargo test -p prover --features metrics --test metrics

      # DEFERRED: cargo test -p checker --test logup -- --include-ignored --test-threads=1
      # Master rule 7. S15's acceptance over the combined toy took 30m18s of a
      # 45-minute run here -- two thirds of it -- and cannot be made to take
      # less: the timestamp channel's table is `[0, 2^19)`, a table of `2^n`
      # rows holds at most `2^n` values, and a Mercury opening needs an even
      # variable count, so the smallest circuit carrying a gap obligation is
      # `2^20` rows. One forward pass over it holds 4.63 GB of inner cells and the
      # file peaks at 18.8 GB, so
      # the file must run single-threaded: two at once would not fit the
      # runner. It is slow because the circuit is the real size, which is
      # exactly the case rule 7 covers, so it runs locally on the stage PR that
      # touches it and the handoff note records the result. The nine cases stay
      # `#[ignore]`d for size, as they were -- that attribute is not what
      # deferred them -- so `cargo test --workspace` is unchanged either way.
      # Put back, with every other `# DEFERRED:` step, before the project is
      # called finished.
      #
      # - name: the LogUp channels over the combined toy
      #   run: cargo test -p checker --test logup -- --include-ignored --test-threads=1

      # DEFERRED: cargo test -p prover --features metrics --test metrics -- --include-ignored
      # Master rule 7. The two ignored cases in that file prove S16's statement
      # twice over -- once through `prove_block` and once through
      # `prove_block_metered`, to hold the two blocks equal byte for byte --
      # and peak at about 8.6 GB each. The file's other eight cases run above,
      # in the `test the metrics configuration` step, and they are what hold
      # the data model and both reports; only the end-to-end property is
      # deferred. `docs/spec/metrics.md` §7.
      #
      # - name: the metrics harness end to end
      #   run: cargo test -p prover --features metrics --test metrics -- --include-ignored --nocapture

      # DEFERRED: cargo test -p prover --test acceptance -- --include-ignored --test-threads=1
      # DEFERRED: cargo test -p verifier --test cli -- --include-ignored --test-threads=1
      # DEFERRED: cargo test --release -p checker --test tamper -- --include-ignored --test-threads=1
      # Master rule 7, for S16's proving suites. Each proves `guests/addsub`'s
      # statement, whose add/sub shard is `2^20` rows -- the floor the
      # timestamp channel sets, so it cannot shrink -- and one statement's
      # proof peaks at 8.6 GB resident -- more in the tamper file, which
      # keeps the honest statement beside each re-proof -- so each file runs
      # single-threaded. Locally, on 18 cores, the three take 322 s, 20 s and,
      # with every stage's twins through S21, 2568 s; the logup step above ran
      # nine times slower on the runner than locally, which puts these at about
      # 50, 3 and 380 minutes. The tamper file's peak is 19.2 GB: a statement's
      # proof with the honest one held beside it. They run locally on every PR
      # that touches the prover, the verifier, a family circuit or the memory
      # and lookup arguments, and the handoff note records the result.
      # The CI-sized halves -- the add/sub circuit row by row, the core's
      # statement, wire and load-rule suites, the signature pin -- run in the
      # `test` step on every push.
      #
      # Since S21 the file also carries the delegation anchor's twins over
      # `guests/keccak-test`'s nine-shard block
      # (`checker::assert_anchor_twins_refused`), and it runs at `--release`:
      # a debug build of that block is not a reasonable gate. Those twins run
      # at two levels on purpose. `verify_block` checks the memory argument
      # before any shard's own gates, so a dropped invocation -- and the same
      # forgery with its anchor side repaired -- is `MemoryArgument` there;
      # the three request-side zeroings are asserted through `verify_shard`
      # instead, where `Constraint` comes first and the gate is the answer.
      # `docs/spec/delegation.md` §5.2 is why that distinction matters for
      # S22 and S23.
      #
      # - name: S16's statement, proved and verified
      #   run: |
      #     cargo test -p prover --test acceptance -- --include-ignored --test-threads=1
      #     cargo test -p verifier --test cli -- --include-ignored --test-threads=1
      # - name: S16's tamper twins
      #   run: cargo test --release -p checker --test tamper -- --include-ignored --test-threads=1

      # DEFERRED: cargo test -p prover --test control -- --include-ignored --test-threads=1
      # Master rule 7, for S17's statement: `guests/control` proves one add/sub
      # and one jump/branch/slt shard, each `2^20` rows for the timestamp
      # channel's floor, and peaks at 18.0 GB since S20 proves its two `2^20`
      # shards at once, so the file runs single-threaded;
      # 85 s locally. S17's tamper twins joined the tamper file above, which now
      # peaks at 11.3 GB. The family's CI-sized half -- the circuit row by row,
      # the comparison exhaustively at a reduced width, the legal masks, the
      # guest's trace against the acceptance matrix and the fill over it -- is
      # `crates/checker/tests/jump_branch_slt.rs`, in the `test` step.
      #
      # - name: S17's statement, proved and verified
      #   run: cargo test -p prover --test control -- --include-ignored --test-threads=1

      # DEFERRED: cargo test -p prover --test alu -- --include-ignored --test-threads=1
      # Master rule 7, for S18's statement: `guests/alu` proves one shard of
      # each of the four execution families -- add/sub, jump/branch/slt,
      # shift/bitwise and mul/div -- each `2^20` rows for the timestamp
      # channel's floor, beside `INIT_TEARDOWN` at `2^16`. It is the largest
      # statement the repository proves: 30.9 GB peak, 67 s locally on 18
      # cores, so the file runs single-threaded. S18's tamper twins joined the
      # tamper file above, which peaked at 15.7 GB with S18's statement and
      # at 17.0 GB since S19's joined it. Both families'
      # CI-sized halves -- each circuit row by row, the division encoding
      # exhaustively at a reduced width, the derived bitwise ops over all
      # 65,536 byte pairs, the legal masks, the guest's trace against the
      # acceptance matrices and each fill over it -- are
      # `crates/checker/tests/shift_bitwise.rs` and `crates/checker/tests/
      # mul_div.rs`, in the `test` step.
      #
      # - name: S18's statement, proved and verified
      #   run: cargo test -p prover --test alu -- --include-ignored --test-threads=1

      # DEFERRED: cargo test --release -p prover --test mem -- --include-ignored --test-threads=1
      # Master rule 7, for S19's statement: `guests/mem` proves one shard of
      # each of five execution families -- add/sub, jump/branch/slt and the
      # three S19 adds -- each `2^20` rows for the timestamp channel's floor,
      # beside `INIT_TEARDOWN` and the first `ZERO_WINDOWS` shard any acceptance
      # statement has had, both at `2^16`. It is now the largest statement the
      # repository proves: 32.3 GB peak, 87 s locally on 18 cores, so the file
      # runs single-threaded. S19's tamper twins joined the tamper file above,
      # which peaks at 17.0 GB with them. The three families' CI-sized halves --
      # each circuit row by row, the splice exhaustively at a reduced width, the
      # legal masks and the kind-bit map, and all three fills over the guest's
      # trace -- are `crates/checker/tests/mem_word.rs`, `mem_subword.rs`,
      # `atomics.rs` and `mem_fill.rs`, in the `test` step.
      #
      # - name: S19's statement, proved and verified
      #   run: cargo test --release -p prover --test mem -- --include-ignored --test-threads=1

      # NOTE (S20): every peak quoted above was re-measured on the S20 tree.
      # Shard proving is now a rayon parallel iterator, so a statement whose
      # families each prove a `2^20` shard holds one forward pass per worker
      # rather than one at a time: `mem` went from 14.7 GB / 119 s to 32.3 GB /
      # 87 s, `alu` from 14.1 / 111 to 30.9 / 67, and `control` from 10.1 to
      # 18.0. `acceptance` (one `2^20` shard) and `tamper` (which proves one
      # shard at a time) did not move. There is no knob; a caller that must
      # bound the peak installs its own rayon pool, as
      # `prover/tests/block.rs::the_block_does_not_depend_on_the_thread_count`
      # does. `docs/handoff/S20-orchestration.md` has the table.

      # DEFERRED: cargo test --release -p prover --test block -- --include-ignored --test-threads=1
      # Master rule 7, for S20's acceptance. `guests/shards` runs 1,064,970
      # add/sub cycles, past the `2^20` floor the timestamp channel sets, so the
      # plan cuts it into two shards of one family -- which is the stage gate,
      # and which cannot be made smaller: 2^20 is the least height a family
      # carrying a timestamp gap obligation can have, so a two-shard family is
      # two `2^20` shards whatever the guest. The file proves seven blocks --
      # the demo five times over, once of them on a single thread, and
      # `guests/mem`'s five-family block once -- and takes 804 s locally on 18
      # cores at a 38.0 GB peak (33.4 GB on another run of the same file, and
      # 25.3 and 33.4 at S20: the spread is what the allocator happens to hold
      # when the largest shard's forward pass runs -- plan for 38), so it
      # runs single-threaded. Its CI-sized halves
      # are `crates/verifier-core/tests/block.rs` (the record layout, the wire
      # forms, the structural rule and the window rule) and
      # `crates/checker/tests/tape.rs` (the frozen absorb order and its negative
      # control), both in the `test` step.
      #
      # - name: S20's block, proved and verified
      #   run: cargo test --release -p prover --test block -- --include-ignored --test-threads=1

      # DEFERRED: cargo test --release -p prover --test keccak -- --include-ignored --test-threads=1
      # Master rule 7, for S21's acceptances 4 and 8, and **the heaviest suite
      # in the repository**: 38.9 GB peak, 124 s locally on 18 cores, so it runs
      # single-threaded. `guests/keccak-test` is nine shards -- six `2^20`
      # execution shards, two `2^16` window shards and one `2^8` KECCAK_F shard
      # -- and it is the delegation shard that costs, not the count: one keccak
      # row is a whole keccak-f[1600] permutation, so the circuit is 354,762
      # inner columns and its forward pass at 256 rows is about 2.9 GB before
      # anything is committed (`docs/spec/delegation.md` §9). The second test in
      # the file, `guests/keccak-unused`, proves eight shards: the same nine
      # families, zero invocations, zero delegation shards.
      #
      # Its CI-sized halves are `crates/checker/tests/keccak.rs` (the circuit's
      # forward pass against `emulator::keccak_f` at four rows, and ten negative
      # controls each naming its gate), `crates/emulator/tests/keccak.rs`
      # (`keccak_f` against `tiny-keccak` on all 1,600 single-bit states),
      # `crates/emulator/tests/guests.rs` (the corpus digests re-derived from
      # `tiny-keccak`, and both guests run) and
      # `crates/program/tests/delegation.rs` (static detachment over every
      # committed guest), all in the `test` step. The anchor's four tamper twins
      # are in `crates/checker/tests/tamper.rs`, deferred with it.
      #
      # Measured: 2 passed, 130 s, 38.9 GB peak on its own and 33.5 GB inside a
      # batch -- the same spread `block` above has, so plan for 39.
      #
      # - name: S21's block with a delegation shard, proved and verified
      #   run: cargo test --release -p prover --test keccak -- --include-ignored --test-threads=1

      # The crates the recursion guest links compile unchanged for the guest.
      - name: guest target builds
        run: cargo build -p field -p constants -p transcript -p poly -p sumcheck -p constraints -p gkr-verify -p verifier-core --target riscv32imac-unknown-none-elf

      # Acceptance 1, typed out: from the guest's own directory, with no flags
      # beyond the target, and everything else coming from the template config.
      - name: a guest builds from the template config
        run: cd guests/fib && cargo build --target riscv32imac-unknown-none-elf

      # Master rule 8: committed fixtures are regenerated and diffed, so a
      # silently edited vector file fails the build. `transcript-ref` is its own
      # workspace on purpose; see the comment in its manifest.
      #
      # kat-gen's `srs` group needs the 19 GB ceremony file, which is gitignored
      # and absent here: that group prints why and writes nothing, so the diff
      # below stays clean and `crates/srs/tests/vectors/` is only ever
      # regenerated on a machine that has the assets. For the same reason CI
      # runs none of `crates/srs`'s tests -- they all return quietly. See
      # crates/srs/CLAUDE.md.
      #
      # The `program` group's identity pin needs the same file and is skipped the
      # same way; the rest of that group, and the `isa` group, need only
      # llvm-objdump, which rust-toolchain.toml installs.
      #
      # `crates/pcs` is not in that position: its suite builds its own toy SRS
      # and runs in full here, and its `pcs` kat-gen group needs no asset. Only
      # one test in it -- the menu heights above 2^18, over real ceremony
      # bases -- needs the file and returns quietly without it.
      #
      # The `guests` group is likewise absent from a bare `cargo run -p kat-gen`,
      # for a different reason: it rebuilds the guest ELFs, and a guest ELF is
      # not byte-reproducible across machines -- rustc embeds absolute paths in
      # panic-location strings and stable Rust cannot remap them. Two clean
      # builds on one machine do agree, and `crates/loader/tests/reproducible.rs`
      # proves it. The `loader` group, which regenerates everything derivable
      # *from* those ELFs, does run and is diffed.
      #
      # The `gkr` group writes S13's toy circuit, cached and cache-free, from its
      # one definition in kat-gen; the diff holds the committed artifacts to it.
      - name: committed fixtures are reproducible
        run: |
          cargo run -p kat-gen
          cargo run --manifest-path tools/transcript-ref/Cargo.toml
          git diff --exit-code -- crates/field/tests/vectors/ crates/transcript/tests/vectors/ crates/poly/tests/vectors/ crates/curve/tests/vectors/ crates/srs/tests/vectors/ crates/pcs/tests/vectors/ crates/loader/tests/vectors/ crates/isa/tests/vectors/ crates/program/tests/vectors/ crates/constraints/tests/vectors/ crates/checker/tests/vectors/
