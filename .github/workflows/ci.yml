name: ci

# The toolchain, its components and the guest target all come from
# rust-toolchain.toml; rustup installs them on the first cargo invocation.
# Nothing here names a version, so nothing here can drift from that pin.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: toolchain
        run: rustup show && cargo --version

      # Four workspaces, all gated: the root, the transcript reference oracle,
      # `crates/guest-sdk` and `guests/`. The last two compile only for the
      # guest target, and guest-sdk holds nearly all of the repository's
      # `unsafe`, so it is the one that most needs the lints. Neither takes
      # `--all-targets`: there is no `test` crate for a no_std target.
      - name: fmt
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path tools/transcript-ref/Cargo.toml --all -- --check
          cargo fmt --manifest-path crates/guest-sdk/Cargo.toml --all -- --check
          cargo fmt --manifest-path guests/Cargo.toml --all -- --check

      - name: clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path tools/transcript-ref/Cargo.toml --all-targets -- -D warnings
          (cd crates/guest-sdk && cargo clippy --target riscv32imac-unknown-none-elf -- -D warnings)
          (cd guests && cargo clippy --bins -- -D warnings)
          # `debug-info` is the workspace's one cargo feature. A configuration
          # nobody builds is broken and undiscovered, so this one is built,
          # linted and tested here like the default.
          cargo clippy -p prover --all-targets --features debug-info -- -D warnings

      - name: test
        run: cargo test --workspace

      # The debug log's own suite, plus its unit tests -- which live in
      # `src/debug.rs` and so are compiled by no other job in this file.
      # `docs/tools.md` §3.
      - name: test the debug-info configuration
        run: |
          cargo test -p prover --features debug-info --test debug_info
          cargo test -p prover --features debug-info --lib

      # Not run here: the suites that prove real shards. Each is `#[ignore]`d,
      # needs tens of GiB, and runs by hand, one file at a time; what needs no
      # proof runs in the `test` step.
      #
      # - name: the LogUp channels over the combined toy
      #   run: cargo test -p checker --test logup -- --include-ignored --test-threads=1
      #
      # - name: the add/sub statement, proved and verified
      #   run: |
      #     cargo test -p prover --test acceptance -- --include-ignored --test-threads=1
      #     cargo test -p verifier --test cli -- --include-ignored --test-threads=1
      #
      # - name: the tamper twins
      #   run: cargo test --release -p checker --test tamper -- --include-ignored --test-threads=1
      #
      # - name: the jump/branch/slt statement, proved and verified
      #   run: cargo test -p prover --test control -- --include-ignored --test-threads=1
      #
      # - name: the shift/bitwise and mul/div statement, proved and verified
      #   run: cargo test -p prover --test alu -- --include-ignored --test-threads=1
      #
      # - name: the memory-op statement, proved and verified
      #   run: cargo test --release -p prover --test mem -- --include-ignored --test-threads=1
      #
      # - name: one execution as a block, its busiest family cut into two shards
      #   run: cargo test --release -p prover --test block -- --include-ignored --test-threads=1
      #
      # - name: the streamed block, at two backpressure bounds
      #   run: cargo test --release -p prover --test streaming -- --include-ignored --test-threads=1
      #
      # - name: public values, bound end to end
      #   run: cargo test --release -p prover --test public_io -- --include-ignored --test-threads=1

      # A guest builds from its own directory with no flags beyond the target,
      # everything else coming from the template config.
      - name: a guest builds from the template config
        run: cd guests/fib && cargo build --target riscv32imac-unknown-none-elf

      # Committed fixtures are regenerated and diffed, so a silently edited
      # vector file fails the build (`docs/tools.md` §7). `transcript-ref` is
      # its own workspace; see its manifest.
      #
      # The opt-in `guests` group does not run, because a guest ELF is not
      # byte-reproducible across machines (two clean builds on one machine
      # agree, and `crates/loader/tests/reproducible.rs` checks that).
      - name: committed fixtures are reproducible
        run: |
          cargo run -p kat-gen
          cargo run --manifest-path tools/transcript-ref/Cargo.toml
          git diff --exit-code -- crates/field/tests/vectors/ crates/transcript/tests/vectors/ crates/poly/tests/vectors/ crates/loader/tests/vectors/ crates/isa/tests/vectors/ crates/program/tests/vectors/ crates/constraints/tests/vectors/ crates/checker/tests/vectors/
