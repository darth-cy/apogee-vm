<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" width="900" height="352" role="img" aria-labelledby="title desc">
  <title id="title">Measured, not promised: block 257,510 of glamsterdam-devnet-8</title>
  <desc id="desc">101.5 Mgas: one ethereum block (60 transactions through the stateless validator, inside the VM.); 198M: risc-v cycles (Each one a proved row, across 207 shards.); 1: proof at the top (A 116-shard recursion tree, folded into one Groth16 proof.); 3.62M gas: to verify on-chain (One contract call, 34,980 bytes of calldata.); 704 B: per shard opening (One Mercury proof opens every committed column.); 23: circuit families (7 for instructions, 5 for memory, 6 delegations, 5 for recursion.); 67,251: conformance cases (Every tests-zkevm v21.0.1 pair, matched natively.); 0: outside cryptography (Fields, curve, pairing, PCS, GKR and Groth16: all written in-repo.)</desc>
  <style>
    .frame { fill: #030914; stroke: rgba(64, 108, 176, 0.30); stroke-width: 1; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { fill: url(#card); stroke: rgba(64, 108, 176, 0.30); stroke-width: 1; }
    .value { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
    .small { font-size: 16.5px; letter-spacing: 0; }
    .label { fill: #EAF3FB; font-size: 14px; font-weight: 600; }
    .note { fill: #899AB1; font-size: 12.5px; }
  </style>
  <defs>
    <radialGradient id="wash" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#5F8DD7" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#5F8DD7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081325"/>
      <stop offset="1" stop-color="#050D1C"/>
    </linearGradient>
    <radialGradient id="corner">
      <stop offset="0" stop-color="#5F8DD7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5F8DD7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card-shape"><rect width="206" height="150" rx="14"/></clipPath>
    <linearGradient id="value" gradientUnits="userSpaceOnUse" x1="18" y1="0" x2="188" y2="0">
      <stop offset="0" stop-color="#EAF3FB"/>
      <stop offset="0.40" stop-color="#C0D6F1"/>
      <stop offset="0.78" stop-color="#719DE2"/>
      <stop offset="1" stop-color="#9093F9"/>
    </linearGradient>
  </defs>
  <rect class="frame" x="0.5" y="0.5" width="899" height="351" rx="16"/>
  <rect x="1" y="1" width="898" height="280" rx="15" fill="url(#wash)"/>

  <svg x="20" y="20" width="206" height="150">
    <rect class="card" x="0.5" y="0.5" width="205" height="149" rx="14"/>
    <circle cx="186" cy="20" r="60" fill="url(#corner)" clip-path="url(#card-shape)"/>
    <text class="mono value" x="18" y="50" fill="url(#value)">101.5<tspan class="small"> Mgas</tspan></text>
    <text class="sans label" x="18" y="78">One Ethereum block</text>
    <text class="sans note" x="18" y="101">60 transactions through</text>
    <text class="sans note" x="18" y="118">the stateless validator,</text>
    <text class="sans note" x="18" y="135">inside the VM.</text>
  </svg>

  <svg x="238" y="20" width="206" height="150">
    <rect class="card" x="0.5" y="0.5" width="205" height="149" rx="14"/>
    <circle cx="186" cy="20" r="60" fill="url(#corner)" clip-path="url(#card-shape)"/>
    <text class="mono value" x="18" y="50" fill="url(#value)">198M</text>
    <text class="sans label" x="18" y="78">RISC-V cycles</text>
    <text class="sans note" x="18" y="101">Each one a proved row,</text>
    <text class="sans note" x="18" y="118">across 207 shards.</text>
  </svg>

  <svg x="456" y="20" width="206" height="150">
    <rect class="card" x="0.5" y="0.5" width="205" height="149" rx="14"/>
    <circle cx="186" cy="20" r="60" fill="url(#corner)" clip-path="url(#card-shape)"/>
    <text class="mono value" x="18" y="50" fill="url(#value)">1</text>
    <text class="sans label" x="18" y="78">Proof at the top</text>
    <text class="sans note" x="18" y="101">A 116-shard recursion</text>
    <text class="sans note" x="18" y="118">tree, folded into one</text>
    <text class="sans note" x="18" y="135">Groth16 proof.</text>
  </svg>

  <svg x="674" y="20" width="206" height="150">
    <rect class="card" x="0.5" y="0.5" width="205" height="149" rx="14"/>
    <circle cx="186" cy="20" r="60" fill="url(#corner)" clip-path="url(#card-shape)"/>
    <text class="mono value" x="18" y="50" fill="url(#value)">3.62M<tspan class="small"> gas</tspan></text>
    <text class="sans label" x="18" y="78">To verify on-chain</text>
    <text class="sans note" x="18" y="101">One contract call,</text>
    <text class="sans note" x="18" y="118">34,980 bytes of calldata.</text>
  </svg>

  <svg x="20" y="182" width="206" height="150">
    <rect class="card" x="0.5" y="0.5" width="205" height="149" rx="14"/>
    <circle cx="186" cy="20" r="60" fill="url(#corner)" clip-path="url(#card-shape)"/>
    <text class="mono value" x="18" y="50" fill="url(#value)">704<tspan class="small"> B</tspan></text>
    <text class="sans label" x="18" y="78">Per shard opening</text>
    <text class="sans note" x="18" y="101">One Mercury proof opens</text>
    <text class="sans note" x="18" y="118">every committed column.</text>
  </svg>

  <svg x="238" y="182" width="206" height="150">
    <rect class="card" x="0.5" y="0.5" width="205" height="149" rx="14"/>
    <circle cx="186" cy="20" r="60" fill="url(#corner)" clip-path="url(#card-shape)"/>
    <text class="mono value" x="18" y="50" fill="url(#value)">23</text>
    <text class="sans label" x="18" y="78">Circuit families</text>
    <text class="sans note" x="18" y="101">7 for instructions, 5 for</text>
    <text class="sans note" x="18" y="118">memory, 6 delegations,</text>
    <text class="sans note" x="18" y="135">5 for recursion.</text>
  </svg>

  <svg x="456" y="182" width="206" height="150">
    <rect class="card" x="0.5" y="0.5" width="205" height="149" rx="14"/>
    <circle cx="186" cy="20" r="60" fill="url(#corner)" clip-path="url(#card-shape)"/>
    <text class="mono value" x="18" y="50" fill="url(#value)">67,251</text>
    <text class="sans label" x="18" y="78">Conformance cases</text>
    <text class="sans note" x="18" y="101">Every tests-zkevm v21.0.1</text>
    <text class="sans note" x="18" y="118">pair, matched natively.</text>
  </svg>

  <svg x="674" y="182" width="206" height="150">
    <rect class="card" x="0.5" y="0.5" width="205" height="149" rx="14"/>
    <circle cx="186" cy="20" r="60" fill="url(#corner)" clip-path="url(#card-shape)"/>
    <text class="mono value" x="18" y="50" fill="url(#value)">0</text>
    <text class="sans label" x="18" y="78">Outside cryptography</text>
    <text class="sans note" x="18" y="101">Fields, curve, pairing,</text>
    <text class="sans note" x="18" y="118">PCS, GKR and Groth16:</text>
    <text class="sans note" x="18" y="135">all written in-repo.</text>
  </svg>
</svg>
