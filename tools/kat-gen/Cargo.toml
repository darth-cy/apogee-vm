[package]
name = "kat-gen"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
constants.workspace = true
test-support.workspace = true
# The `pcs` group is the one generator that links the implementation: there is
# no second Mercury to ask, so its proof fixture is a regression pin on the
# transcript schedule rather than an oracle. Its other file, the G1 absorption
# vectors, is arkworks all the way down. See `src/pcs.rs`.
field.workspace = true
poly.workspace = true
transcript.workspace = true
srs.workspace = true
pcs.workspace = true
# The `program` group's identity pin is generated by the preprocessor itself,
# for the same reason the `pcs` proof fixture is: there is no second one.
loader.workspace = true
program.workspace = true
# The `gkr` and `lookup` groups: S13's toy circuit and S15's combined toy are
# defined here and nowhere else, each written as a `CircuitArtifact` — the
# former by hand, the latter through `constraints::memory`'s constructor.
constraints.workspace = true
# The `tape` group: `checker::check_global_tape` over a shaped statement, which
# is the global commit phase (`verifier-core`) diffed against the frozen
# pre-fork order the checker writes out independently.
checker.workspace = true
verifier-core.workspace = true
# The `revm` group builds and traces S24's guest, so that a regeneration is
# itself the guest-versus-native-revm differential.
emulator.workspace = true
# The `block` group: the manual fixture refresh, and the only thing in this
# repository that talks to the network. It is not in `DEFAULT_GROUPS`, so CI
# never reaches it.
host.workspace = true
# `block` again: one JSON-RPC parameter list, for the `finalized` probe.
serde_json.workspace = true
postcard.workspace = true
# `guests/revm-block`'s library half: the program the guest runs, called here
# on the host to build the committed witness and to produce the answer the
# guest is held to. A path into the guest workspace, exactly as
# `crates/emulator` takes one to `guests/consistency`.
revm-block = { path = "../../guests/revm-block" }
ark-bn254.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-poly.workspace = true
num-bigint.workspace = true

