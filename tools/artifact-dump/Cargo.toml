[package]
name = "artifact-dump"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The image, and `load_elf` is the only thing that builds one.
loader.workspace = true
# The RAM window, printed in the report so a reader can place the segments
# without opening another file.
constants.workspace = true
# The frozen wire form. Taken with no features, exactly as `crates/loader`'s
# own tests take it, so what this writes is the encoding those tests exercise.
postcard.workspace = true
# sha256 and hex, for the digests that pin an artifact to its ELF.
test-support.workspace = true
