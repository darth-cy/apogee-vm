[package]
name = "program"
version.workspace = true
edition.workspace = true
publish.workspace = true

# `std`, because program identity is Mercury commitments and `pcs` is std.
[dependencies]
# FamilyId, the extra-mask bits, the defaults, the identity tags, the RAM window.
constants.workspace = true
# `G1Affine`, the type of a setup commitment.
curve.workspace = true
field.workspace = true
isa.workspace = true
# `ProgramImage` is the input; `load_elf` is never called here.
loader.workspace = true
pcs.workspace = true
poly.workspace = true
srs.workspace = true
# `VmConfig`, `ProgramIdentity`, the statement descriptor, the window rules and
# the identity digest, which moved there at S16 so the no_std verifier binds a
# statement with the same code the prover does; re-exported here.
verifier-core.workspace = true

[dev-dependencies]
# The bignum oracle for `src/secp256k1.rs`: every limb routine is differenced
# against it, and the 512-by-256 division exhaustively at reduced width.
num-bigint.workspace = true
test-support.workspace = true
transcript.workspace = true
