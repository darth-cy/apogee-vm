[package]
name = "field"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
constants.workspace = true
serde.workspace = true

# The guest-target backend, and only there: `Fr`'s add, multiply and inverse
# route through `guest_sdk::recursion`'s delegation shims when this crate is
# compiled for the guest (`docs/spec/delegation.md` §13). A *target*
# dependency, not a cargo feature — the workspace still has one build
# configuration, and a host build never resolves this edge. The direction is
# forced: `guest-sdk` may not depend on `field`, or cargo refuses the cycle.
[target.'cfg(target_arch = "riscv32")'.dependencies]
guest-sdk = { path = "../guest-sdk" }

[dev-dependencies]
test-support.workspace = true
ark-bn254.workspace = true
ark-ff.workspace = true
postcard.workspace = true
