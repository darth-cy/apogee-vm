[package]
name = "emulator"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
constants.workspace = true
# The Poseidon2 precompile's function is the transcript's permutation.
field.workspace = true
transcript.workspace = true
isa.workspace = true
loader.workspace = true
program.workspace = true
trace.workspace = true

[dev-dependencies]
# Falcon-512 keys, signatures and addresses under Poseidon2's HashToPoint,
# which the SDK's verifier and `guests/amazon` are held to.
apogee-falcon512.workspace = true
# `tests/guests.rs` reads `tools/falcon512/vectors.json`, the other
# implementations' signatures.
serde_json.workspace = true
test-support.workspace = true
# `tests/archive.rs` holds an archived run's public values to the live run's
# through `io_digest`.
transcript.workspace = true
