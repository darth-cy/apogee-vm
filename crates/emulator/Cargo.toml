[package]
name = "emulator"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
constants.workspace = true
# The `FR_ARITH` and `POSEIDON2` delegations are `field::Fr`'s arithmetic and
# `transcript::poseidon2_permute`, and the executor runs *those*, not a second
# copy of either: a delegation whose executor and whose circuit were written
# twice would be two definitions to keep equal.
field.workspace = true
transcript.workspace = true
isa.workspace = true
loader.workspace = true
program.workspace = true
trace.workspace = true

[dev-dependencies]
test-support.workspace = true
# The `EC_ADD` executor is held to this crate's own BN254 G1 arithmetic,
# which is an independent implementation in a different coordinate system: the
# delegation is homogeneous projective and `curve::G1Projective` is Jacobian,
# so agreeing on the affine result is a real comparison rather than two copies
# of one formula.
curve.workspace = true
tiny-keccak.workspace = true
# The revm workload guest, likewise: `tests/revm.rs` calls `revm_block::run` on
# the host as the native-revm oracle the guest's committed output is held to.
revm-block = { path = "../../guests/revm-block" }
# `tests/revm.rs`' negative controls encode a witness the decoder must refuse,
# so they need the encoder without `BlockWitness::encode`'s canonicity assert.
postcard.workspace = true
