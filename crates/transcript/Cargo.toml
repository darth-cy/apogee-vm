[package]
name = "transcript"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
constants.workspace = true
field.workspace = true
serde.workspace = true

# The guest-target backend, and only there: `poseidon2_permute` routes through
# `guest_sdk::recursion`'s delegation shim when this crate is compiled for the
# guest (`docs/spec/delegation.md` §12). A *target* dependency, not a cargo
# feature; see `crates/field/Cargo.toml` for the same edge and the same reason.
[target.'cfg(target_arch = "riscv32")'.dependencies]
guest-sdk = { path = "../guest-sdk" }

[dev-dependencies]
test-support.workspace = true
postcard.workspace = true
