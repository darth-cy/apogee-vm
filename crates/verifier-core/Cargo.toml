[package]
name = "verifier-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

# `#![no_std]` + alloc: the recursion guest links this crate, and CI builds it
# for `riscv32imac-unknown-none-elf`. Everything a shard's verification does
# except the one Mercury opening lives here; `crates/verifier` is the `std`
# wrapper that decodes curve points and calls `pcs::batch_verify`.
# `docs/spec/shard-proof.md` is normative.
[dependencies]
constants.workspace = true
# `FamilyCircuit`, the registry a key's circuits are held to, and the rules a
# key's load runs: `validate`, `check_memory`, `check_discharge`.
constraints.workspace = true
field.workspace = true
# `verify`, the boundary, the window challenge, the LogUp slots and root check.
gkr-verify.workspace = true
poly.workspace = true
transcript.workspace = true

[dev-dependencies]
transcript.workspace = true
