[package]
name = "checker"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The standalone validators of `docs/spec/gkr.md` §4.2 and §4.3, the circuit
# dump, the witness-row evaluator and the artifact cross-check, plus the
# `checker` CLI over the first three. None of it calls `constraints`' own law
# checks: the laws are enforced twice, by independent code.
[dependencies]
# `challenge_slot::NAMES`, for rendering a challenge coefficient.
constants.workspace = true
constraints.workspace = true
field.workspace = true
# The kernel (`eval_gate`, `gate_values`, re-exported from `gkr-verify`) and the
# forward pass the cross-check runs.
gkr.workspace = true
poly.workspace = true
# `TamperHarness`: a statement re-proved through `prover`, and one shard or the
# block verified through `verifier::verify_shard` or `verifier::verify_block`.
gkr-verify.workspace = true
program.workspace = true
prover.workspace = true
trace.workspace = true
# The transcript-tape validator: `TranscriptEvent`, the global commit phase's
# absorb sequence as the checker renders and diffs it.
transcript.workspace = true
verifier.workspace = true
verifier-core.workspace = true

[dev-dependencies]
# `tests/memory.rs`' honest statement and `tests/multiset.rs`' tampers: a
# committed guest ELF loaded, decoded, traced and filled into the memory
# columns, then forwarded, reconciled and proved.
emulator.workspace = true
loader.workspace = true
# `tests/logup.rs`: the toy's witness and multiplicity columns are
# committed, and `g`/`beta` are drawn strictly after every absorb.
pcs.workspace = true
srs.workspace = true
rayon.workspace = true
curve.workspace = true
# The family suites' instructions, each built as an `Instr` and routed
# through `program::row_kind` to its one mask bit.
isa.workspace = true
# The tests' base-layer binding: their proofs absorb `witness_digest` of the
# committed columns first, where a shard proof absorbs commitments.
sumcheck.workspace = true
test-support.workspace = true
