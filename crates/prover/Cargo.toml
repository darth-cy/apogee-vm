[package]
name = "prover"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The shard prover and the global commit phase. `docs/spec/shard-proof.md` is
# normative. std + rayon: commitments and the forward pass are data-parallel.

# THE WORKSPACE'S ONE AND ONLY CARGO FEATURE, and the one exception to master
# anti-goal 1, granted by the owner at S-DEBUG for `src/debug`, the proving
# debug log, and for nothing else. It is off by default, it enables no
# dependency and it changes no proof byte -- `tests/debug_info.rs` proves the
# last of those by proving one statement twice in the one build, once with the
# log silent and once with it at `deep`, and comparing the blocks on the wire.
# What it turns on is the log's invariant scans, which are work proportional to
# a shard and must not sit in the path of a real proving run; the level is then
# chosen at run time with `APOGEE_DEBUG`.
#
# There was a second, `metrics`, granted at S20 for the proving harness and
# RETIRED at S-STREAM: it measured the archived path, the streaming prover is
# the only path a block is proved down now, and a harness nobody runs is the
# configuration anti-goal 1 exists to forbid. The rule stands for every future
# progression: `tests/one_feature.rs` fails if a second `[features]` table
# appears anywhere in the workspace, or if this one grows a second key.
# `docs/spec/debug-info.md`.
[features]
debug-info = []

[dependencies]
constants.workspace = true
constraints.workspace = true
curve.workspace = true
# The streaming prover drives the executor: `emulator::StreamingRun` hands back
# one shard at a time, so the prover's loop is what decides when a column
# exists (`docs/spec/streaming.md` §2). Nothing else in this crate names it.
emulator.workspace = true
field.workspace = true
gkr.workspace = true
loader.workspace = true
pcs.workspace = true
poly.workspace = true
# The phase snapshots hold S02's `TranscriptSnapshot` in its `postcard` form.
postcard.workspace = true
program.workspace = true
rayon.workspace = true
srs.workspace = true
trace.workspace = true
transcript.workspace = true
# `encode_srs_verifier`, the key's `SrsVerifier` bytes.
verifier.workspace = true
verifier-core.workspace = true

[dev-dependencies]
# Hex, for printing an identity a handoff note records.
test-support.workspace = true
# S20 acceptance 3: the transcript-tape validator over the statement the block
# was actually proved for. A dev-dependency cycle -- `checker` depends on this
# crate -- which cargo resolves: the dev graph is built separately.
checker.workspace = true
# S24's workload guest. `tests/revm.rs` -- and not `tests/common`, which stays
# free of the guest workspace because `crates/checker` includes it too -- builds
# the guest's own binary and checks the output commitment it leaves in the
# journal against the same library's own answer, byte for byte. A path into the
# guest workspace, and a test dependency only.
revm-block = { path = "../../guests/revm-block" }
