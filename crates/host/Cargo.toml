[package]
name = "host"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The host SDK: the path from a guest ELF and its inputs to a `BlockProof`.
#
# `host::prove` and `host::verify` are convenience wrappers and nothing more:
# `prover::prove_block_streaming` and `verifier::verify_block` remain the
# protocol entry points, and the verifier's `(key, proof, public inputs)`
# signature holds because the wrapper adds nothing to the verifier's inputs --
# it reads the statement out of the proof rather than taking a second copy of
# it.
[dependencies]
emulator.workspace = true
loader.workspace = true
program.workspace = true
prover.workspace = true
verifier.workspace = true
verifier-core.workspace = true
